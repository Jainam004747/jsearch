<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jsearch</title>
<style>
  :root {
    --bg: #fbfaf7; --panel: #ffffff; --fg: #1f2328; --muted: #5f6670; --line: #e3e0d8;
    --accent: #1a6b5a; --link: #1d4fbf; --url: #2d7a3d;
    --serif: Georgia, "Iowan Old Style", "Times New Roman", serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #15171a; --panel: #1d2024; --fg: #e6e8eb; --muted: #9aa1ab; --line: #2e3338;
            --accent: #5cc4a8; --link: #8ab4ff; --url: #7fcf8e; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.55 var(--sans); }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }
  header { padding: 28px 0 18px; border-bottom: 1px solid var(--line); }
  .home header { border: 0; padding-top: 18vh; text-align: center; }
  h1 { font: 700 30px/1 var(--serif); margin: 0 0 16px; letter-spacing: -0.01em; }
  h1 span { color: var(--accent); }
  .home h1 { font-size: 52px; margin-bottom: 22px; }
  form { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; font: inherit; font-size: 17px; padding: 11px 16px; border-radius: 24px;
          border: 1px solid var(--line); background: var(--panel); color: var(--fg); }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button { font: inherit; padding: 10px 20px; border-radius: 24px; border: 0; background: var(--accent); color: #fff; cursor: pointer; }
  .tips { color: var(--muted); font-size: 13px; margin-top: 12px; }
  .tips code { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
  .meta { color: var(--muted); font-size: 13px; margin: 14px 0 6px; }
  .result { padding: 14px 0; border-bottom: 1px solid var(--line); }
  .result a.title { font: 600 19px/1.3 var(--serif); color: var(--link); text-decoration: none; }
  .result a.title:hover { text-decoration: underline; }
  .url { color: var(--url); font-size: 13px; word-break: break-all; }
  .snippet { margin: 4px 0 0; color: var(--fg); }
  .snippet b { background: color-mix(in srgb, var(--accent) 18%, transparent); padding: 0 2px; border-radius: 3px; }
  .pager { display: flex; gap: 10px; justify-content: center; padding: 22px 0 40px; }
  .pager button { background: var(--panel); color: var(--fg); border: 1px solid var(--line); }
  .empty { color: var(--muted); padding: 30px 0; }
  footer { color: var(--muted); font-size: 12px; text-align: center; padding: 20px 0; }
</style>
</head>
<body class="home">
<div class="wrap">
  <header>
    <h1>j<span>search</span></h1>
    <form id="f"><input id="q" name="q" autocomplete="off" autofocus placeholder="Search your index" aria-label="Search"><button>Search</button></form>
    <div class="tips">Try <code>"exact phrase"</code>, <code>-exclude</code>, <code>site:example.com</code></div>
  </header>
  <main id="results"></main>
  <footer id="stats"></footer>
</div>
<script>
"use strict";
const $ = id => document.getElementById(id);
let page = 1;

async function search(q, p) {
  page = p;
  const res = await fetch("/api/search?q=" + encodeURIComponent(q) + "&page=" + p);
  const data = await res.json();
  document.body.classList.remove("home");
  history.replaceState(null, "", "?q=" + encodeURIComponent(q) + (p > 1 ? "&page=" + p : ""));
  const main = $("results");
  main.replaceChildren();
  const meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent = data.total + " result" + (data.total === 1 ? "" : "s") + " · " +
    (data.cached ? "from cache" : data.millis + " ms");
  main.append(meta);
  if (!data.results.length) {
    const e = document.createElement("p");
    e.className = "empty";
    e.textContent = "No pages match. Try fewer or different words.";
    main.append(e);
  }
  for (const r of data.results) {
    const div = document.createElement("div");
    div.className = "result";
    const a = document.createElement("a");
    a.className = "title"; a.href = r.url; a.textContent = r.title; // text, never HTML
    const url = document.createElement("div");
    url.className = "url"; url.textContent = r.url;
    const snip = document.createElement("p");
    snip.className = "snippet";
    snip.innerHTML = r.snippet; // escaped on the server; only <b> tags are added
    div.append(a, url, snip);
    main.append(div);
  }
  const pager = document.createElement("div");
  pager.className = "pager";
  if (p > 1) pager.append(btn("← Previous", () => search(q, p - 1)));
  if (p * 10 < data.total) pager.append(btn("Next →", () => search(q, p + 1)));
  main.append(pager);
}
function btn(label, fn) { const b = document.createElement("button"); b.textContent = label; b.onclick = fn; return b; }

$("f").addEventListener("submit", e => { e.preventDefault(); if ($("q").value.trim()) search($("q").value, 1); });
fetch("/api/stats").then(r => r.json()).then(s => {
  $("stats").textContent = s.documents + " documents · " + s.terms + " terms · " + s.segments + " segment(s) · " +
    Math.round(s.bytes / 1024) + " KB on disk";
});
const params = new URLSearchParams(location.search);
if (params.get("q")) { $("q").value = params.get("q"); search(params.get("q"), Number(params.get("page") || 1)); }
</script>
</body>
</html>
